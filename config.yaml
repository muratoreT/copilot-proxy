listen:
  host: 0.0.0.0
  port: 8081

localAIServer:
  url: http://127.0.0.1:1234

logging:
  requests: true
  responses: false
  body_preview_chars: 400

defaults:
  max_tokens: 4096
  temperature: 0.1
  top_p: 1.0

rewrite:
  clamp_max_tokens: true
  remove_reasoning: false
  inject_thinking_budget: false
  thinking_budget: 1024

debug:
  enabled: true
  log_dir: logs/debug
  max_response_size_mb: 20

streaming_retry:
  enabled: true
  max_retries: 1
  only_after_tool_messages: true
  retry_delay_ms: 100

models:
  "qwen/qwen3.6-27b":
    max_tokens: 8192
  "qwen3-0.6b":
    max_tokens: 2048
